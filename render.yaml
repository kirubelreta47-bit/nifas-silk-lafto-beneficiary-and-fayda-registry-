services:
  - type: web
    name: nsl-fayda-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
